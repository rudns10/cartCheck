<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 820" width="390" height="820"
     font-family="Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

  <!-- Phone background (Background token #F7F8FA) -->
  <rect width="390" height="820" fill="#F7F8FA"/>

  <!-- Status bar -->
  <rect width="390" height="44" fill="#F7F8FA"/>
  <text x="24" y="28" font-size="14" font-weight="600" fill="#1A1A1A">9:41</text>
  <g transform="translate(330,18)" fill="#1A1A1A">
    <rect x="0" y="2" width="4" height="8" rx="1"/>
    <rect x="6" y="0" width="4" height="10" rx="1"/>
    <rect x="12" y="-2" width="4" height="12" rx="1"/>
    <rect x="22" y="0" width="22" height="10" rx="2" fill="none" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="24" y="2" width="16" height="6" rx="1"/>
  </g>

  <!-- App bar (Surface) -->
  <rect x="0" y="44" width="390" height="56" fill="#FFFFFF"/>
  <text x="24" y="79" font-size="20" font-weight="700" fill="#1A1A1A">이마트 트레이더스</text>
  <text x="208" y="79" font-size="14" fill="#6B7280">▾</text>
  <g transform="translate(354,68)" fill="#6B7280">
    <circle cx="0" cy="0" r="2"/>
    <circle cx="0" cy="6" r="2"/>
    <circle cx="0" cy="12" r="2"/>
  </g>

  <!-- ===== Hero summary card ===== -->
  <rect x="20" y="120" width="350" height="280" rx="16" fill="#FFFFFF"/>

  <!-- 현재 합산 (할인 전, 임계치 체크 기준) -->
  <g transform="translate(40,148)">
    <text x="0" y="0" font-size="12" fill="#6B7280">현재 합산</text>
    <rect x="58" y="-13" width="76" height="18" rx="9" fill="#E5E7EB"/>
    <text x="96" y="0" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">할인 전 · 임계치</text>
  </g>

  <!-- Display number -->
  <text x="40" y="216" font-size="52" font-weight="800" fill="#1A1A1A"
        font-feature-settings="'tnum'" letter-spacing="-1.5">32,400원</text>

  <!-- Threshold row -->
  <text x="40" y="246" font-size="13" fill="#6B7280">임계치 50,000원까지</text>
  <text x="350" y="246" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="end"
        font-feature-settings="'tnum'">17,600원</text>

  <!-- Progress bar (background then fill at 64%) -->
  <rect x="40" y="262" width="310" height="8" rx="4" fill="#E5E7EB"/>
  <rect x="40" y="262" width="198.4" height="8" rx="4" fill="#00A968"/>

  <!-- Percentage -->
  <text x="350" y="288" font-size="11" font-weight="700" fill="#00A968" text-anchor="end">64%</text>

  <!-- Divider -->
  <line x1="40" y1="308" x2="350" y2="308" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 판매가 합 (구매 정보 — 실 구매가) -->
  <text x="40" y="334" font-size="12" fill="#6B7280">구매 정보 (실 구매가)</text>
  <text x="40" y="370" font-size="22" font-weight="700" fill="#1A1A1A"
        font-feature-settings="'tnum'" letter-spacing="-0.5">29,400원</text>
  <g transform="translate(280,358)">
    <rect x="0" y="0" width="70" height="22" rx="11" fill="#D1FAE5"/>
    <text x="35" y="15" font-size="11" font-weight="700" fill="#047857" text-anchor="middle"
          font-feature-settings="'tnum'">−3,000원</text>
  </g>

  <!-- ===== 배너 슬롯 (cart_inline · §20) ===== -->
  <g transform="translate(20,410)">
    <rect width="350" height="80" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <path d="M 16 0 L 16 80 L 0 80 Q 0 0 16 0 Z" fill="#FEF3C7"/>

    <rect x="24" y="12" width="38" height="18" rx="9" fill="#F3F4F6"/>
    <text x="43" y="24" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">광고</text>

    <g transform="translate(326,16)" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="8" y2="8"/>
      <line x1="8" y1="0" x2="0" y2="8"/>
    </g>

    <rect x="24" y="38" width="34" height="34" rx="10" fill="#FEF3C7"/>
    <g transform="translate(41,55)">
      <path d="M -10 -6 L 10 -6 L 8 0 L -8 0 Z" fill="#92400E"/>
      <rect x="-9" y="0" width="18" height="9" fill="#92400E" opacity="0.8"/>
      <rect x="-2" y="3" width="4" height="6" fill="#FEF3C7"/>
    </g>

    <text x="68" y="50" font-size="13" font-weight="700" fill="#1A1A1A">트레이더스 · 4만원 더 담으면</text>
    <text x="68" y="66" font-size="11" fill="#6B7280">치즈·요거트 50% 할인 + 5,000원 쿠폰</text>

    <g transform="translate(316,55)">
      <circle cx="0" cy="0" r="12" fill="#F3F4F6"/>
      <path d="M -3 -4 L 3 0 L -3 4 Z" fill="#1E3A5F"/>
    </g>
  </g>

  <!-- ===== Item list section ===== -->
  <text x="20" y="508" font-size="13" font-weight="600" fill="#6B7280">담은 항목 (3)</text>

  <rect x="20" y="522" width="350" height="190" rx="16" fill="#FFFFFF"/>

  <!-- Column header (2 lines) -->
  <text x="40" y="540" font-size="11" font-weight="600" fill="#9CA3AF">품목명</text>
  <text x="225" y="554" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="end">단가</text>
  <text x="262" y="554" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="middle">수량</text>
  <text x="350" y="554" font-size="11" font-weight="600" fill="#9CA3AF" text-anchor="end">합계</text>
  <line x1="40" y1="562" x2="350" y2="562" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Item 1: 우유 1L × 2 (2줄) -->
  <text x="40" y="578" font-size="15" font-weight="600" fill="#1A1A1A">우유 1L</text>
  <text x="225" y="592" font-size="13" fill="#6B7280" text-anchor="end"
        font-feature-settings="'tnum'">3,200원</text>
  <text x="262" y="592" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">× 2</text>
  <text x="350" y="592" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="end"
        font-feature-settings="'tnum'">6,400원</text>
  <line x1="40" y1="600" x2="350" y2="600" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Item 2: 사과 5입 × 1 (2줄) -->
  <text x="40" y="616" font-size="15" font-weight="600" fill="#1A1A1A">사과 5입</text>
  <text x="225" y="630" font-size="13" fill="#6B7280" text-anchor="end"
        font-feature-settings="'tnum'">8,900원</text>
  <text x="262" y="630" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">× 1</text>
  <text x="350" y="630" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="end"
        font-feature-settings="'tnum'">8,900원</text>
  <line x1="40" y1="638" x2="350" y2="638" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Item 3: 라면 5입 × 3 (2줄) -->
  <text x="40" y="654" font-size="15" font-weight="600" fill="#1A1A1A">라면 5입</text>
  <text x="225" y="668" font-size="13" fill="#6B7280" text-anchor="end"
        font-feature-settings="'tnum'">4,300원</text>
  <text x="262" y="668" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">× 3</text>
  <text x="350" y="668" font-size="15" font-weight="700" fill="#1A1A1A" text-anchor="end"
        font-feature-settings="'tnum'">12,900원</text>
  <line x1="40" y1="676" x2="350" y2="676" stroke="#E5E7EB" stroke-width="1"/>

  <!-- More indicator -->
  <text x="195" y="694" font-size="13" fill="#6B7280" text-anchor="middle">⋯ 더보기</text>

  <!-- ===== Bottom action area ===== -->
  <rect x="0" y="720" width="390" height="100" fill="#FFFFFF"/>
  <line x1="0" y1="720" x2="390" y2="720" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Secondary button: 직접 입력 -->
  <rect x="20" y="744" width="165" height="56" rx="12" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
  <g transform="translate(70,765)" fill="#1E3A5F">
    <path d="M 0 12 L 12 0 L 16 4 L 4 16 L 0 16 Z" stroke="#1E3A5F" stroke-width="1.5" fill="none"/>
  </g>
  <text x="115" y="781" font-size="16" font-weight="600" fill="#1E3A5F" text-anchor="middle">직접 입력</text>

  <!-- Primary button: 촬영 -->
  <rect x="205" y="744" width="165" height="56" rx="12" fill="#1E3A5F"/>
  <g transform="translate(252,762)" fill="none" stroke="#FFFFFF" stroke-width="1.6">
    <rect x="0" y="4" width="22" height="16" rx="2"/>
    <circle cx="11" cy="12" r="4.5"/>
    <rect x="7" y="0" width="8" height="4" rx="1" fill="#FFFFFF" stroke="none"/>
  </g>
  <text x="305" y="781" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">촬영</text>

  <!-- Home indicator (bottom safe area) -->
  <rect x="125" y="808" width="140" height="4" rx="2" fill="#1A1A1A"/>
</svg>
