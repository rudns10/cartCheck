<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 80" width="350" height="80"
     font-family="Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

  <!-- Card background -->
  <rect width="350" height="80" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 좌측 액센트 컬러 띠 (16dp radius와 맞춰 좌측만) -->
  <path d="M 16 0 L 16 80 L 0 80 Q 0 0 16 0 Z" fill="#FEF3C7"/>
  <path d="M 16 0 L 16 80 L 0 80 Q 0 0 16 0 Z" fill="#1E3A5F" opacity="0.08"/>

  <!-- [광고] 라벨 칩 -->
  <rect x="24" y="12" width="38" height="18" rx="9" fill="#F3F4F6"/>
  <text x="43" y="24" font-size="10" font-weight="700" fill="#6B7280" text-anchor="middle">광고</text>

  <!-- 닫기 아이콘 -->
  <g transform="translate(326,16)" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round">
    <line x1="0" y1="0" x2="8" y2="8"/>
    <line x1="8" y1="0" x2="0" y2="8"/>
  </g>

  <!-- 마트 아이콘 (geometric placeholder) -->
  <rect x="24" y="38" width="34" height="34" rx="10" fill="#FEF3C7"/>
  <g transform="translate(41,55)">
    <path d="M -10 -6 L 10 -6 L 8 0 L -8 0 Z" fill="#92400E"/>
    <rect x="-9" y="0" width="18" height="9" fill="#92400E" opacity="0.8"/>
    <rect x="-2" y="3" width="4" height="6" fill="#FEF3C7"/>
  </g>

  <!-- Title -->
  <text x="68" y="50" font-size="13" font-weight="700" fill="#1A1A1A">이마트 트레이더스 · 이번 주 행사</text>

  <!-- Subtitle -->
  <text x="68" y="66" font-size="11" fill="#6B7280">생필품 5만원 이상 구매 시 5,000원 할인</text>

  <!-- CTA arrow -->
  <g transform="translate(316,55)">
    <circle cx="0" cy="0" r="12" fill="#F3F4F6"/>
    <path d="M -3 -4 L 3 0 L -3 4 Z" fill="#1E3A5F"/>
  </g>
</svg>
