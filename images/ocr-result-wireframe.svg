<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 820" width="390" height="820"
     font-family="Pretendard, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

  <!-- Background: dimmed camera frame ===== -->
  <rect width="390" height="820" fill="#0A0F18"/>

  <!-- Faintly visible price tag in background (from camera frame) -->
  <g opacity="0.18">
    <rect x="60" y="200" width="270" height="160" rx="4" fill="#F0F0EC"/>
    <text x="80" y="240" font-size="16" font-weight="700" fill="#1A1A1A">서울우유 비요뜨</text>
    <text x="310" y="330" font-size="32" font-weight="800" fill="#1A1A1A" text-anchor="end">8,980</text>
  </g>

  <!-- Status bar -->
  <text x="24" y="28" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>

  <!-- Dim overlay -->
  <rect width="390" height="820" fill="rgba(0,0,0,0.4)"/>

  <!-- ===== Bottom sheet ===== -->
  <path d="M 0 320 Q 0 296 24 296 L 366 296 Q 390 296 390 320 L 390 820 L 0 820 Z" fill="#FFFFFF"/>

  <!-- Drag handle -->
  <rect x="179" y="308" width="32" height="4" rx="2" fill="#D1D5DB"/>

  <!-- Header -->
  <text x="24" y="348" font-size="18" font-weight="700" fill="#1A1A1A">인식 결과 확인</text>
  <text x="366" y="348" font-size="13" font-weight="600" fill="#1E3A5F" text-anchor="end">재촬영</text>

  <!-- ===== Captured thumbnail + product name area ===== -->
  <rect x="20" y="372" width="72" height="72" rx="12" fill="#E5E7EB"/>
  <g transform="translate(28,388)">
    <rect width="56" height="40" rx="3" fill="#FFFFFF"/>
    <text x="28" y="14" font-size="6" font-weight="700" fill="#1A1A1A" text-anchor="middle">서울우유</text>
    <text x="50" y="34" font-size="12" font-weight="800" fill="#1A1A1A" text-anchor="end">8,980</text>
  </g>

  <text x="104" y="394" font-size="11" fill="#6B7280">상품명</text>
  <text x="104" y="418" font-size="16" font-weight="700" fill="#1A1A1A">서울우유 비요뜨 초코링</text>
  <g transform="translate(348,408)" fill="none" stroke="#1E3A5F" stroke-width="1.5">
    <path d="M 0 12 L 10 2 L 14 6 L 4 16 L 0 16 Z"/>
  </g>

  <text x="104" y="440" font-size="11" fill="#9CA3AF">138g×8입 · 1.10kg</text>

  <!-- ===== Price card ===== -->
  <rect x="20" y="476" width="350" height="200" rx="16" fill="#F7F8FA"/>

  <!-- 정상가 -->
  <text x="40" y="510" font-size="13" fill="#6B7280">정상가</text>
  <text x="350" y="510" font-size="15" font-weight="600" fill="#6B7280" text-anchor="end"
        font-feature-settings="'tnum'" text-decoration="line-through">9,980원</text>

  <!-- 할인 -->
  <text x="40" y="540" font-size="13" fill="#6B7280">할인</text>
  <text x="350" y="540" font-size="15" font-weight="600" fill="#DC2626" text-anchor="end"
        font-feature-settings="'tnum'">−1,000원</text>

  <!-- Divider -->
  <line x1="40" y1="558" x2="350" y2="558" stroke="#E5E7EB" stroke-width="1"/>

  <!-- 판매가 (강조) -->
  <text x="40" y="588" font-size="13" font-weight="700" fill="#1A1A1A">판매가 (합산 대상)</text>
  <text x="350" y="612" font-size="32" font-weight="800" fill="#1A1A1A" text-anchor="end"
        font-feature-settings="'tnum'" letter-spacing="-0.8">8,980원</text>

  <!-- 신뢰도 뱃지 -->
  <rect x="40" y="630" width="86" height="24" rx="12" fill="#D1FAE5"/>
  <g transform="translate(50,636)" fill="#047857">
    <path d="M 0 5 L 4 9 L 12 1" stroke="#047857" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
  <text x="68" y="647" font-size="11" font-weight="700" fill="#047857">신뢰도 95%</text>

  <!-- ===== Bottom buttons ===== -->
  <rect x="0" y="720" width="390" height="100" fill="#FFFFFF"/>
  <line x1="0" y1="720" x2="390" y2="720" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Cancel -->
  <rect x="20" y="744" width="100" height="56" rx="12" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="70" y="781" font-size="16" font-weight="600" fill="#6B7280" text-anchor="middle">취소</text>

  <!-- Add to cart (primary) -->
  <rect x="132" y="744" width="238" height="56" rx="12" fill="#1E3A5F"/>
  <g transform="translate(165,762)" fill="none" stroke="#FFFFFF" stroke-width="2">
    <circle cx="10" cy="10" r="10"/>
    <line x1="10" y1="5" x2="10" y2="15" stroke-linecap="round"/>
    <line x1="5" y1="10" x2="15" y2="10" stroke-linecap="round"/>
  </g>
  <text x="226" y="781" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">장바구니에 추가</text>

  <!-- Home indicator -->
  <rect x="125" y="808" width="140" height="4" rx="2" fill="#1A1A1A"/>
</svg>
