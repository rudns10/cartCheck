  <rect x="40" y="650" width="24" height="24" rx="12" fill="#9CA3AF"/>
  <text x="52" y="667" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="76" y="670" font-size="15" font-weight="700" fill="#1A1A1A">홈플러스</text>
