<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MartCart · 직접 입력</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  /* ===== App bar (with back arrow) ===== */
  .appbar{padding:14px 16px}
  .appbar .back{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s;
    margin-right:4px;
  }
  .appbar .back:active{background:var(--divider-soft)}
  .appbar .back svg{width:22px; height:22px; color:var(--text)}
  .appbar h1{margin:0; font-size:18px; font-weight:700}

  /* ===== Scroll body ===== */
  .scroll{position:absolute; top:110px; left:0; right:0; bottom:96px; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px 16px 24px}
  .scroll::-webkit-scrollbar{width:0}

  /* ===== Section card ===== */
  .section{background:#fff; border-radius:var(--r-card); box-shadow:var(--shadow-card); padding:18px 18px 8px; margin-bottom:14px}
  .section h2{margin:0 0 14px; font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.2px}

  /* ===== Field ===== */
  .field{position:relative; margin-bottom:14px}
  .field > label{
    display:block; font-size:12px; font-weight:600; color:var(--muted);
    margin-bottom:6px; padding-left:2px;
  }
  .field > label .req{color:var(--danger); margin-left:2px}
  .field > label .opt{color:var(--muted-2); font-weight:500; margin-left:6px}

  .input{
    width:100%; height:52px; padding:0 16px;
    background:#F7F8FA; border:1.5px solid transparent; border-radius:12px;
    font-family:inherit; font-size:16px; font-weight:600; color:var(--text);
    transition:background .15s, border-color .15s;
    -webkit-appearance:none; appearance:none;
    font-feature-settings:'tnum';
  }
  .input::placeholder{color:var(--muted-2); font-weight:500}
  .input:focus{outline:none; background:#fff; border-color:var(--primary)}
  .input.error{border-color:var(--danger); background:#FEF2F2}

  .input-suffix{position:relative}
  .input-suffix .input{padding-right:42px}
  .input-suffix .suffix{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    font-size:14px; font-weight:600; color:var(--muted); pointer-events:none;
  }

  /* ===== Recent chips ===== */
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px}
  .chip{
    background:#F1F5F9; color:var(--text);
    padding:7px 12px; border-radius:99px;
    font-size:12px; font-weight:600; cursor:pointer;
    transition:background .15s;
    border:1px solid transparent;
  }
  .chip:active{background:#E2E8F0}
  .chip .ic{color:var(--muted-2); margin-right:4px; font-size:11px}

  /* ===== Quantity stepper ===== */
  .qty-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0 14px}
  .qty-row label{font-size:13px; font-weight:600; color:var(--text)}
  .stepper{display:flex; align-items:center; gap:0; background:#F7F8FA; border-radius:12px; padding:4px}
  .stepper button{
    width:36px; height:36px; border-radius:8px; border:none; background:transparent;
    font-size:18px; font-weight:700; color:var(--primary); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .stepper button:active{background:var(--divider)}
  .stepper button:disabled{color:var(--muted-2); cursor:not-allowed}
  .stepper .val{
    min-width:48px; text-align:center; font-size:17px; font-weight:700;
    font-feature-settings:'tnum';
  }

  /* ===== Computed sale preview / validation ===== */
  .computed{
    margin-top:8px; padding:14px 16px;
    background:linear-gradient(135deg, #ECFDF5, #F0FDF4);
    border-radius:12px; border:1px solid #BBF7D0;
  }
  .computed.warn{background:linear-gradient(135deg, #FEF3C7, #FFFBEB); border-color:#FDE68A}
  .computed.invalid{background:linear-gradient(135deg, #FEF2F2, #FEE2E2); border-color:#FECACA}
  .computed .top{display:flex; justify-content:space-between; align-items:center}
  .computed .top .lbl{font-size:11px; font-weight:700; color:var(--accent-dark); letter-spacing:.3px}
  .computed.warn .top .lbl{color:var(--warn-text)}
  .computed.invalid .top .lbl{color:#991B1B}
  .computed .top .badge{font-size:10px; font-weight:700; padding:2px 8px; border-radius:8px; background:#fff}
  .computed .price{margin-top:6px; font-size:24px; font-weight:800; color:var(--text); font-feature-settings:'tnum'; letter-spacing:-.5px}
  .computed .price .won{font-size:14px; font-weight:700; color:var(--muted); margin-left:2px}
  .computed .formula{margin-top:6px; font-size:11px; color:var(--muted); font-feature-settings:'tnum'}
  .computed .formula b{color:var(--text); font-weight:700}

  /* ===== Photo attach ===== */
  .photo-row{display:flex; gap:12px; align-items:center; padding:4px 0 14px}
  .photo-thumb{
    width:64px; height:64px; border-radius:12px;
    background:repeating-linear-gradient(45deg, #F1F5F9, #F1F5F9 6px, #E2E8F0 6px, #E2E8F0 12px);
    border:1.5px dashed var(--muted-2);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted-2); cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .photo-thumb:active{border-color:var(--primary)}
  .photo-thumb svg{width:26px; height:26px}
  .photo-meta{font-size:12px; color:var(--muted)}
  .photo-meta b{display:block; color:var(--text); font-size:13px; font-weight:700; margin-bottom:2px}

  /* ===== Bottom CTA bar ===== */
  .actions{position:absolute; left:0; right:0; bottom:0; height:96px; background:#fff; border-top:1px solid var(--divider); padding:14px 20px; z-index:15; display:flex; gap:12px; flex-direction:column}
  .actions .preview-line{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); padding:0 4px}
  .actions .preview-line b{color:var(--text); font-size:14px; font-weight:800; font-feature-settings:'tnum'}
  .actions .btn{flex:1; height:54px}
</style>
</head>
<body>

<div class="device">

  <!-- Status bar -->
  <div class="statusbar">
    <span>9:41</span>
    <div class="right">
      <div class="bars"><span></span><span></span><span></span><span></span></div>
      <div class="battery"><i></i></div>
    </div>
  </div>
  <div class="island"></div>

  <!-- App bar -->
  <div class="appbar">
    <div class="back" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <h1>직접 입력</h1>
  </div>

  <!-- Scroll body -->
  <div class="scroll">

    <!-- Section: 상품 -->
    <div class="section">
      <h2>상품 정보</h2>

      <div class="field">
        <label>상품명 <span class="req">*</span></label>
        <input class="input" id="name" type="text" placeholder="예: 서울우유 1L" autocomplete="off"/>
      </div>

      <div class="field" style="margin-bottom:8px">
        <label>최근 입력</label>
        <div class="chips" id="recents">
          <div class="chip" data-name="서울우유 1L" data-orig="3500" data-disc="0">서울우유 1L</div>
          <div class="chip" data-name="농심 신라면 5개입" data-orig="4300" data-disc="0">농심 신라면 5개입</div>
          <div class="chip" data-name="청정원 양조간장" data-orig="8900" data-disc="1000">청정원 양조간장</div>
          <div class="chip" data-name="매일 바이오 요거트" data-orig="5200" data-disc="800">매일 바이오 요거트</div>
        </div>
      </div>

      <div class="photo-row">
        <div class="photo-thumb" onclick="alert('카메라 또는 갤러리 선택 (미구현)')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
        <div class="photo-meta">
          <b>사진 추가 (선택)</b>
          나중에 가격표를 다시 확인할 때 도움이 됩니다
        </div>
      </div>
    </div>

    <!-- Section: 가격 -->
    <div class="section">
      <h2>가격</h2>

      <div class="field">
        <label>정상가 <span class="req">*</span></label>
        <div class="input-suffix">
          <input class="input" id="orig" type="text" inputmode="numeric" placeholder="0"/>
          <span class="suffix">원</span>
        </div>
      </div>

      <div class="field">
        <label>할인 <span class="opt">선택 · 없으면 비워두세요</span></label>
        <div class="input-suffix">
          <input class="input" id="disc" type="text" inputmode="numeric" placeholder="0"/>
          <span class="suffix">원</span>
        </div>
      </div>

      <!-- Live computed sale price + validation -->
      <div class="computed" id="computed" style="display:none">
        <div class="top">
          <span class="lbl" id="compLbl">판매가 (합산 대상)</span>
          <span class="badge" id="compBadge">자동 계산</span>
        </div>
        <div class="price"><span id="compPrice">0</span><span class="won">원</span></div>
        <div class="formula" id="compFormula"></div>
      </div>

      <div class="qty-row">
        <label>수량</label>
        <div class="stepper">
          <button id="qMinus" onclick="qty(-1)">−</button>
          <div class="val" id="qVal">1</div>
          <button id="qPlus" onclick="qty(1)">+</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom CTA -->
  <div class="actions">
    <div class="preview-line">
      <span>장바구니 합계 예상</span>
      <b id="cartPreview">39,600원 → 39,600원</b>
    </div>
    <button class="btn btn-primary" id="addBtn" disabled style="opacity:.5; pointer-events:none" onclick="add()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
      장바구니에 추가
    </button>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"><span id="toastMsg">메시지</span></div>

  <div class="home-indicator"></div>
</div>

<div class="caption">최근 입력 칩 탭 시 자동 채움 · 정상가 입력하면 검증 표시 · <a href="index.html">← 장바구니</a></div>

<script>
  const CART_ORIGINAL = 39600;

  const $name = document.getElementById('name');
  const $orig = document.getElementById('orig');
  const $disc = document.getElementById('disc');
  const $addBtn = document.getElementById('addBtn');
  const $cartPreview = document.getElementById('cartPreview');

  let quantity = 1;

  function fmt(n){ return n.toLocaleString('ko-KR'); }
  function parseWon(s){ return parseInt((s||'').replace(/[^\d]/g,''), 10) || 0; }
  function formatNumberInput(el){
    const raw = parseWon(el.value);
    el.value = raw ? raw.toLocaleString('ko-KR') : '';
  }

  [$orig, $disc].forEach(el => el.addEventListener('input', () => { formatNumberInput(el); recalc(); }));
  $name.addEventListener('input', recalc);

  function recalc(){
    const name = $name.value.trim();
    const orig = parseWon($orig.value);
    const disc = parseWon($disc.value);
    const sale = Math.max(0, orig - disc);

    const c = document.getElementById('computed');
    const lbl = document.getElementById('compLbl');
    const price = document.getElementById('compPrice');
    const badge = document.getElementById('compBadge');
    const formula = document.getElementById('compFormula');

    if (orig > 0){
      c.style.display='block';
      c.classList.remove('warn','invalid');
      price.textContent = fmt(sale);
      if (disc === 0){
        lbl.textContent = '판매가 (= 정상가, 할인 없음)';
        badge.textContent = '자동 계산';
        formula.innerHTML = `검증식 통과 — 정상가 <b>${fmt(orig)}원</b>`;
      } else if (disc >= orig){
        c.classList.add('invalid');
        lbl.textContent = '할인이 정상가보다 큽니다';
        badge.textContent = '확인 필요';
        formula.innerHTML = `정상가 <b>${fmt(orig)}원</b> − 할인 <b>${fmt(disc)}원</b>`;
      } else {
        lbl.textContent = '판매가 (합산 대상)';
        badge.textContent = '검증식 통과';
        formula.innerHTML = `정상가 <b>${fmt(orig)}원</b> − 할인 <b>${fmt(disc)}원</b> = 판매가 <b>${fmt(sale)}원</b>`;
      }
    } else {
      c.style.display='none';
    }

    // Cart preview using OriginalPrice × quantity (per §6.2 threshold uses original)
    const projected = CART_ORIGINAL + orig * quantity;
    $cartPreview.textContent = `${fmt(CART_ORIGINAL)}원 → ${fmt(projected)}원`;

    const ok = name.length > 0 && orig > 0 && disc < orig;
    if (ok){
      $addBtn.removeAttribute('disabled');
      $addBtn.style.opacity = '';
      $addBtn.style.pointerEvents = '';
    } else {
      $addBtn.setAttribute('disabled','');
      $addBtn.style.opacity = '.5';
      $addBtn.style.pointerEvents = 'none';
    }
  }

  function qty(delta){
    quantity = Math.max(1, quantity + delta);
    document.getElementById('qVal').textContent = quantity;
    document.getElementById('qMinus').disabled = quantity <= 1;
    recalc();
  }

  // Recent chips
  document.getElementById('recents').addEventListener('click', e=>{
    const chip = e.target.closest('.chip');
    if (!chip) return;
    $name.value = chip.dataset.name;
    $orig.value = (+chip.dataset.orig).toLocaleString('ko-KR');
    $disc.value = (+chip.dataset.disc) ? (+chip.dataset.disc).toLocaleString('ko-KR') : '';
    recalc();
    $name.focus();
  });

  function add(){
    const name = $name.value;
    const orig = parseWon($orig.value);
    const disc = parseWon($disc.value);
    const sale = Math.max(0, orig - disc);

    const added = JSON.parse(localStorage.getItem('martcart.added') || '[]');
    added.push({
      id: 'man_' + Date.now(),
      name,
      original: orig,
      discount: disc,
      sale,
      quantity,
      thumb: '✎',
      addedAt: Date.now(),
    });
    localStorage.setItem('martcart.added', JSON.stringify(added));

    toast(`${name} 추가됨 · 합산 ${fmt(CART_ORIGINAL + orig * quantity)}원`);
    setTimeout(()=> window.location.href='index.html', 900);
  }

  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 3000);
  }

  recalc();
</script>
</body>
</html>
